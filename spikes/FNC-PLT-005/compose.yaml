name: fincilia-fnc-plt-005

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: fincilia_auth_spike
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fincilia_auth_spike_admin
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fincilia_auth_spike"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - fincilia_auth_spike_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  integration-test:
    profiles: ["test"]
    image: node:22.20.0-alpine@sha256:dbcedd8aeab47fbc0f4dd4bffa55b7c3c729a707875968d467aaaea42d6225af
    working_dir: /workspace
    command: ["sh", "-lc", "npm ci --ignore-scripts && npm run typecheck && npm test"]
    environment:
      DATABASE_URL: postgresql://fincilia_app:fincilia_auth_spike_app@postgres:5432/fincilia_auth_spike
      ADMIN_DATABASE_URL: postgresql://postgres:fincilia_auth_spike_admin@postgres:5432/fincilia_auth_spike
      EVENT_WORKER_DATABASE_URL: postgresql://fincilia_event_worker:fincilia_event_worker_spike@postgres:5432/fincilia_auth_spike
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api/package.json:/workspace/package.json:ro
      - ./api/package-lock.json:/workspace/package-lock.json:ro
      - ./api/tsconfig.json:/workspace/tsconfig.json:ro
      - ./api/vitest.config.mts:/workspace/vitest.config.mts:ro
      - ./api/src:/workspace/src:ro
      - ./api/test:/workspace/test:ro
      - api_node_modules:/workspace/node_modules

volumes:
  fincilia_auth_spike_pgdata:
  api_node_modules:
