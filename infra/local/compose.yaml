name: fincilia-local

# Stack local completo de Fincilia. Datos exclusivamente sinteticos.
#
# Dos reglas rigen el fichero entero:
#
# - Toda imagen esta fijada por digest. Una etiqueta puede reapuntarse a otros
#   bytes sin cambiar de nombre, y entonces "reproducible" deja de significar nada.
# - Hay dos redes. `private` es `internal: true` y no tiene salida a internet: si
#   un fichero subido consiguiera ejecutar algo, no tiene a donde llamar. `edge`
#   existe solo para los dos servicios que el navegador necesita alcanzar.
#
# Las zonas de evidencia (quarantine/raw/derived/exports) las crea la API en su
# arranque cuando el entorno es local, de forma idempotente. Un contenedor de un
# solo uso obligaria a `up --wait` a distinguir "termino" de "se cayo".
#
# Docker IGNORA la publicacion de puertos en una red `internal`. Por eso postgres
# y valkey no publican nada: ponerlos en `edge` para exponer un puerto de
# conveniencia les daria salida a internet, y la base de datos es justo donde eso
# menos conviene. Para entrar a psql desde el host: `docker compose exec postgres psql`.
#
# Los puertos publicados se ligan a 127.0.0.1, nunca a 0.0.0.0.

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${FINCILIA_LOCAL_DB_NAME:-fincilia_local}
      POSTGRES_USER: ${FINCILIA_LOCAL_DB_ADMIN_USER:-fincilia_local_admin}
      POSTGRES_PASSWORD: ${FINCILIA_LOCAL_DB_ADMIN_PASSWORD:-fincilia_local_admin_only}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    volumes:
      - fincilia_local_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - fincilia_local_private
    labels:
      com.fincilia.data-class: synthetic_only
      com.fincilia.environment: local

  valkey:
    image: valkey/valkey:8.1-alpine@sha256:e0eb7c480958d32bdc4357a74bdd70653ae15f2f9b4c93c4a5a9fad1dc471c84
    # Sin persistencia a proposito: Valkey es cache, locks efimeros y progreso.
    # Nunca es autoridad financiera, asi que perderlo no puede perder un hecho.
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    stop_grace_period: 10s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data
    networks:
      - fincilia_local_private
    labels:
      com.fincilia.data-class: synthetic_only
      com.fincilia.environment: local

  objectstore:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${FINCILIA_OBJECT_ACCESS_KEY:-fincilia_local_object}
      MINIO_ROOT_PASSWORD: ${FINCILIA_OBJECT_SECRET_KEY:-fincilia_local_object_only}
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:${FINCILIA_LOCAL_OBJECT_CONSOLE_PORT:-59001}
    ports:
      - "127.0.0.1:${FINCILIA_LOCAL_OBJECT_PORT:-59000}:9000"
      - "127.0.0.1:${FINCILIA_LOCAL_OBJECT_CONSOLE_PORT:-59001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    volumes:
      - fincilia_local_objectdata:/data
    networks:
      - fincilia_local_private
      - fincilia_local_edge
    labels:
      com.fincilia.data-class: synthetic_only
      com.fincilia.environment: local

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      FINCILIA_ENV: local
      FINCILIA_LOG_LEVEL: ${FINCILIA_LOG_LEVEL:-info}
      FINCILIA_OTEL_ENDPOINT: disabled
      FINCILIA_DATABASE_URL: postgresql://${FINCILIA_LOCAL_DB_APP_USER:-fincilia_app}:${FINCILIA_LOCAL_APP_PASSWORD:-fincilia_local_app_only}@postgres:5432/${FINCILIA_LOCAL_DB_NAME:-fincilia_local}
      FINCILIA_CACHE_URL: redis://valkey:6379/0
      FINCILIA_OBJECT_STORE_ENDPOINT: http://objectstore:9000
      FINCILIA_OBJECT_ACCESS_KEY: ${FINCILIA_OBJECT_ACCESS_KEY:-fincilia_local_object}
      FINCILIA_OBJECT_SECRET_KEY: ${FINCILIA_OBJECT_SECRET_KEY:-fincilia_local_object_only}
      FINCILIA_AUTH_SIGNING_KEY: ${FINCILIA_AUTH_SIGNING_KEY:-fincilia_local_signing_key_synthetic_only_32}
      FINCILIA_AI_GATEWAY_ENABLED: "false"
      FINCILIA_REAL_DATA_ENABLED: "false"
      FINCILIA_PAYMENTS_ENABLED: "false"
    ports:
      - "127.0.0.1:${FINCILIA_LOCAL_API_PORT:-58080}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live', timeout=3).status==200 else 1)\""]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 8s
    stop_grace_period: 15s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    networks:
      - fincilia_local_private
      - fincilia_local_edge
    labels:
      com.fincilia.data-class: synthetic_only
      com.fincilia.environment: local

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      FINCILIA_ENV: local
      # La web habla con la API por la red privada, no por el puerto del host: el
      # navegador nunca llama a la API directamente, y por eso el token puede
      # vivir solo en una cookie httpOnly.
      FINCILIA_API_BASE_URL: http://api:8000
      FINCILIA_WEB_SECURE_COOKIES: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${FINCILIA_LOCAL_WEB_PORT:-53000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/entrar',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 8s
    stop_grace_period: 15s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fincilia_local_private
      - fincilia_local_edge
    labels:
      com.fincilia.data-class: synthetic_only
      com.fincilia.environment: local

  worker:
    build:
      context: ../..
      dockerfile: workers/document/Dockerfile
    environment:
      FINCILIA_ENV: local
      FINCILIA_LOG_LEVEL: ${FINCILIA_LOG_LEVEL:-info}
      FINCILIA_SERVICE_NAME: fincilia-worker
      # Rol propio, no el de la API. El worker no lee identidad ni credenciales, y
      # no escribe en la cola mas que por sus dos funciones.
      FINCILIA_DATABASE_URL: postgresql://${FINCILIA_LOCAL_DB_WORKER_USER:-fincilia_worker}:${FINCILIA_LOCAL_WORKER_PASSWORD:-fincilia_local_worker_only}@postgres:5432/${FINCILIA_LOCAL_DB_NAME:-fincilia_local}
      FINCILIA_CACHE_URL: redis://valkey:6379/1
      FINCILIA_OBJECT_STORE_ENDPOINT: http://objectstore:9000
      FINCILIA_OBJECT_ACCESS_KEY: ${FINCILIA_OBJECT_ACCESS_KEY:-fincilia_local_object}
      FINCILIA_OBJECT_SECRET_KEY: ${FINCILIA_OBJECT_SECRET_KEY:-fincilia_local_object_only}
      FINCILIA_AI_GATEWAY_ENABLED: "false"
      FINCILIA_REAL_DATA_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/fincilia-worker-alive && find /tmp/fincilia-worker-alive -mmin -1 | grep -q ."]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 8s
    stop_grace_period: 20s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    networks:
      - fincilia_local_private
    labels:
      com.fincilia.data-class: synthetic_only
      com.fincilia.environment: local

  migrate:
    # Perfil propio: las migraciones NO corren al arrancar la API.
    # `startup_auto_migrate` es false en el contrato, y un servicio que migra al
    # arrancar migra tantas veces como replicas tenga.
    profiles: ["migrate"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command:
      - python
      - -m
      - db.migrate.apply
      - --dsn
      - postgresql://${FINCILIA_LOCAL_DB_MIGRATOR_USER:-fincilia_migrator}:${FINCILIA_LOCAL_MIGRATOR_PASSWORD:-fincilia_local_migrator_only}@postgres:5432/${FINCILIA_LOCAL_DB_NAME:-fincilia_local}
    environment:
      # Las pruebas de aislamiento necesitan los dos roles para comprobar que el
      # runtime ve menos que el migrator. Este servicio es de un solo uso y no
      # atiende trafico, asi que llevar ambos DSN no amplia superficie.
      FINCILIA_MIGRATOR_URL: postgresql://${FINCILIA_LOCAL_DB_MIGRATOR_USER:-fincilia_migrator}:${FINCILIA_LOCAL_MIGRATOR_PASSWORD:-fincilia_local_migrator_only}@postgres:5432/${FINCILIA_LOCAL_DB_NAME:-fincilia_local}
      FINCILIA_DATABASE_URL: postgresql://${FINCILIA_LOCAL_DB_APP_USER:-fincilia_app}:${FINCILIA_LOCAL_APP_PASSWORD:-fincilia_local_app_only}@postgres:5432/${FINCILIA_LOCAL_DB_NAME:-fincilia_local}
      # Las pruebas de privilegios necesitan conectarse **como cada rol** para
      # comprobar lo que cada uno no puede hacer. Afirmar un privilegio negativo
      # desde otro rol no prueba nada. Este servicio es de un solo uso, va por
      # perfil y no atiende trafico.
      FINCILIA_WORKER_URL: postgresql://${FINCILIA_LOCAL_DB_WORKER_USER:-fincilia_worker}:${FINCILIA_LOCAL_WORKER_PASSWORD:-fincilia_local_worker_only}@postgres:5432/${FINCILIA_LOCAL_DB_NAME:-fincilia_local}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - fincilia_local_private
    labels:
      com.fincilia.data-class: synthetic_only
      com.fincilia.environment: local

  lifecycle-test:
    profiles: ["test"]
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    entrypoint: ["sh", "/checks/lifecycle.sh"]
    command: ["${FINCILIA_LOCAL_LIFECYCLE_MODE:-initial}"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${FINCILIA_LOCAL_DB_NAME:-fincilia_local}
      PGUSER: ${FINCILIA_LOCAL_DB_ADMIN_USER:-fincilia_local_admin}
      PGPASSWORD: ${FINCILIA_LOCAL_DB_ADMIN_PASSWORD:-fincilia_local_admin_only}
      FINCILIA_LOCAL_APP_PASSWORD: ${FINCILIA_LOCAL_APP_PASSWORD:-fincilia_local_app_only}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./scripts:/checks:ro
    networks:
      - fincilia_local_private
    labels:
      com.fincilia.data-class: synthetic_only
      com.fincilia.environment: local

volumes:
  fincilia_local_pgdata:
    name: fincilia_local_pgdata
  fincilia_local_objectdata:
    name: fincilia_local_objectdata

networks:
  fincilia_local_private:
    name: fincilia_local_private
    internal: true
  fincilia_local_edge:
    # Solo api y objectstore. El worker, la base y la cache nunca la tocan.
    name: fincilia_local_edge
