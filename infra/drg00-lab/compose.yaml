name: fincilia-drg00-lab

# Estas sondas no procesan documentos. Demuestran que cuarentena y procesamiento
# arrancan sin red, sin privilegios y con filesystem raíz de solo lectura.
services:
  quarantine:
    image: python:3.12-alpine3.23@sha256:f0b72408d0c2ee5cf1df64adce9b92ab4f2d3c8cfbb879ac5ab1d0ec07208555
    pull_policy: never
    network_mode: none
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    command: ["python", "-c", "import os; assert os.getuid() == 65532"]

  processing:
    image: python:3.12-alpine3.23@sha256:f0b72408d0c2ee5cf1df64adce9b92ab4f2d3c8cfbb879ac5ab1d0ec07208555
    pull_policy: never
    network_mode: none
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    command: ["python", "-c", "import os; assert os.getuid() == 65532"]
