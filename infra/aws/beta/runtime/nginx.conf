user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  map $request_method $write_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    PATCH $binary_remote_addr;
    DELETE $binary_remote_addr;
  }

  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $write_key zone=writes:10m rate=120r/m;

  log_format safe_json escape=json
    '{"time":"$time_iso8601","status":$status,"method":"$request_method",'
    '"path":"$uri","request_id":"$request_id","bytes":$body_bytes_sent,'
    '"duration":$request_time}';
  access_log /dev/stdout safe_json;
  error_log /dev/stderr warn;

  server {
    listen 8080;
    client_max_body_size 52m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location = /entrar {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location = /registro {
      limit_req zone=auth burst=3 nodelay;
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location / {
      limit_req zone=writes burst=30 nodelay;
      proxy_request_buffering off;
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
