name: fincilia-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Un despacho manual mide rendimiento y un push valida integracion. Son dos
  # trabajos distintos: compartir grupo hacia que uno cancelara al otro.
  group: fincilia-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repository-and-data-policy:
    name: Repository and synthetic-data policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Repository policy
        run: python -m tools.quality_gate.cli
      - name: Python unit tests
        run: >-
          python -m unittest
          tools.architecture_model.test_validate
          tools.adr_readiness.test_validate
          tools.brand_clearance.test_validate
          tools.budget_model.test_validate
          tools.canonical_model.test_validate
          tools.completeness_model.test_validate
          tools.completeness_engine.test_engine
          tools.dedupe_engine.test_engine
          tools.connector_model.test_validate
          tools.cross_contract_model.test_validate
          tools.dfd_model.test_validate
          tools.event_model.test_validate
          tools.idempotency_model.test_validate
          tools.lineage_model.test_validate
          tools.local_stack.test_validate
          tools.migration_readiness.test_validate
          tools.migration_spike.test_validate
          tools.privacy_model.test_validate
          tools.provider_evaluation.test_validate
          tools.quality_strategy.test_validate
          tools.region_decision.test_validate
          tools.research_protocol.test_validate
          tools.runtime_config.test_validate
          tools.s1_readiness.test_validate
          tools.supply_chain.test_validate
          tools.test_catalog.test_validate
          tools.threat_model.test_validate
          tools.ux_contract.test_validate
          tools.work_graph.test_validate
          tools.workspace_contract.test_validate
          tools.dev_cli.test_cli
          tools.quality_gate.test_repo_policy
          tools.synthetic_corpus.test_corpus -v
      - name: Shared product contracts
        run: >-
          python -m unittest discover
          -s packages/contracts/python -t packages/contracts/python
      - name: Validate executable architecture model
        run: python -m tools.architecture_model.validate
      - name: Validate ADR readiness packet
        run: python -m tools.adr_readiness.validate
      - name: Validate provisional brand clearance
        run: python -m tools.brand_clearance.validate
      - name: Validate F0-F2 budget model
        run: python -m tools.budget_model.validate
      - name: Validate executable canonical domain model
        run: python -m tools.canonical_model.validate
      - name: Validate completeness and balance model
        run: python -m tools.completeness_model.validate
      - name: Validate connector contract
        run: python -m tools.connector_model.validate
      - name: Validate cross-contract vocabulary
        run: python -m tools.cross_contract_model.validate
      - name: Validate executable data-flow model
        run: python -m tools.dfd_model.validate
      - name: Validate events, retries and dead letters
        run: python -m tools.event_model.validate
      - name: Validate idempotency and dedupe model
        run: python -m tools.idempotency_model.validate
      - name: Validate field lineage and engine release model
        run: python -m tools.lineage_model.validate
      - name: Validate local stack contract
        run: python -m tools.local_stack.validate
      - name: Validate migration tooling readiness
        run: python -m tools.migration_readiness.validate
      - name: Validate migration spike contract and deterministic plan
        run: |
          python -m tools.migration_spike.cli validate
          python -m tools.migration_spike.cli plan
      - name: Validate executable privacy model
        run: python -m tools.privacy_model.validate
      - name: Validate provider connectivity evaluation
        run: python -m tools.provider_evaluation.validate
      - name: Validate executable quality strategy
        run: python -m tools.quality_strategy.validate
      - name: Reconcile executable test catalogue
        run: python -m tools.test_catalog.cli validate
      - name: Validate region and transmission decision packet
        run: python -m tools.region_decision.validate
      - name: Validate safe research protocol
        run: python -m tools.research_protocol.validate
      - name: Validate runtime configuration contract
        run: python -m tools.runtime_config.validate
      - name: Discover pinned supply-chain components
        run: python -m tools.supply_chain.cli discover
      - name: Validate S1 readiness aggregator contract
        run: python -m tools.s1_readiness.cli validate
      - name: Diagnose the safe developer CLI
        run: python -m tools.dev_cli.cli doctor
      - name: Validate executable threat model
        run: python -m tools.threat_model.validate
      - name: Validate UX prototype contract
        run: python -m tools.ux_contract.validate
      - name: Validate executable work graph
        run: python -m tools.work_graph.validate
      - name: Validate pre-S1 workspace scaffold
        run: python -m tools.workspace_contract.validate
      - name: Verify synthetic corpus byte for byte
        run: python -m tools.synthetic_corpus.cli verify --root tests/golden/synthetic
      - name: Verify adjudicated golden registry
        run: python -m tools.golden_harness.cli verify
      - name: Run adjudicated golden cases
        run: python -m tools.golden_harness.cli run
      - name: Test golden harness controls
        run: python -m unittest tools.golden_harness.test_harness -v
      - name: Verify mutation registry
        run: python -m tools.mutation_harness.cli verify
      - name: Test mutation harness controls
        run: python -m unittest tools.mutation_harness.test_harness -v
      - name: Run contract mutations
        run: python -m tools.mutation_harness.cli run
      - name: Authorization kernel tests in pinned Node
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --workdir /workspace
          node:22.20.0-alpine@sha256:dbcedd8aeab47fbc0f4dd4bffa55b7c3c729a707875968d467aaaea42d6225af
          node --test spikes/FNC-SEC-001/test/*.test.mjs

  stack-spike:
    name: PostgreSQL RLS and worker spike
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spikes/FNC-PLT-001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start PostgreSQL
        run: docker compose up -d --wait
      - name: Typecheck, dependency audit and integration tests
        run: >-
          docker compose --profile test run --rm api-test sh -lc
          "npm ci --ignore-scripts && npm audit --audit-level=high && npm run typecheck && npm test"
      - name: Python worker tests
        working-directory: spikes/FNC-PLT-001/worker
        run: python3 -m unittest -v
      - name: Cleanup
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans

  migration-invariant-spike:
    name: PostgreSQL 17 migration invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run all migration invariants against disposable PostgreSQL
        run: python -m tools.migration_spike.cli run --suite all
      - name: Cleanup the exact disposable project
        if: always()
        working-directory: spikes/FNC-DB-002
        run: docker compose -p fincilia-db-spike down --volumes --remove-orphans

  local-platform:
    name: Local platform lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start from an empty named volume
        run: |
          docker compose --profile test down --volumes --remove-orphans
          docker compose up -d --wait postgres
      - name: Verify bootstrap and write synthetic probe
        run: docker compose --profile test run --rm lifecycle-test initial
      - name: Verify persistence after restart
        run: |
          docker compose restart postgres
          docker compose up -d --wait postgres
          FINCILIA_LOCAL_LIFECYCLE_MODE=persisted docker compose --profile test run --rm lifecycle-test
      - name: Verify persistence after stop and start
        run: |
          docker compose stop postgres
          docker compose start postgres
          docker compose up -d --wait postgres
          FINCILIA_LOCAL_LIFECYCLE_MODE=persisted docker compose --profile test run --rm lifecycle-test
      - name: Build product images
        run: docker compose --profile migrate build api worker web migrate

      # Las suites que corren antes de `up.sh` necesitan mas que PostgreSQL: las
      # pruebas documentales hablan con el almacen de objetos y la API con la
      # cache. Arrancarlas aqui es lo que impide que una suite falle por una
      # dependencia ausente en vez de por el codigo.
      - name: Start every dependency the suites need
        run: docker compose up -d --wait postgres valkey objectstore

      - name: Apply migrations
        run: >-
          docker compose --profile migrate run --rm migrate
          | tee /dev/stderr | grep -q '"mutated": true'

      - name: Applying twice changes nothing
        run: >-
          docker compose --profile migrate run --rm migrate
          | tee /dev/stderr | grep -q '"mutated": false'

      - name: Seed the synthetic demo
        run: >-
          docker compose --profile migrate run --rm migrate python -m db.seed.local
          | tee /dev/stderr | grep -q '"mutated": true'

      - name: Seeding twice changes nothing
        run: >-
          docker compose --profile migrate run --rm migrate python -m db.seed.local
          | tee /dev/stderr | grep -q '"mutated": false'

      - name: Schema tests against real PostgreSQL
        run: >-
          docker compose --profile migrate run --rm migrate
          python -m unittest discover -s /app/db/tests -t /app -v

      # El camino documentado, tal cual lo ejecuta quien clona el repositorio. Es
      # idempotente: migrar y sembrar otra vez no cambian nada.
      - name: Start the full local stack with the documented command
        run: sh up.sh

      - name: API contract tests inside the image
        run: >-
          docker compose run --rm --no-deps api
          python -m unittest discover -s /app/tests -t /app/tests

      - name: Worker job tests against real PostgreSQL and object storage
        run: >-
          docker compose run --rm --no-deps worker
          python -m unittest discover -s /app/tests -t /app/tests -v

      # `build web` ya ejecuta `typecheck` y `build` dentro de la imagen: si el
      # tipo no cuadra, la imagen no existe. Falta el lint, que no bloquea el
      # arranque y por eso se pide aparte.
      - name: Web lint
        run: |
          docker build --target build -f ../../apps/web/Dockerfile -t fincilia-web-check ../..
          docker run --rm fincilia-web-check npm run lint

      - name: Health endpoints answer from the host
        run: |
          curl -fsS http://127.0.0.1:58080/health/live > /dev/null
          curl -fsS http://127.0.0.1:58080/health/ready | tee /dev/stderr | grep -q '"status":"ready"'
          curl -fsS http://127.0.0.1:58080/health/config | grep -q '"data_ceiling":"synthetic_only"'
          curl -fsS http://127.0.0.1:58080/health/ready | grep -q '"name":"schema","status":"up"'

      - name: The demo user signs in and sees one firm and two companies
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:58080/api/v1/auth/session             -H 'content-type: application/json'             -d '{"username":"ana@demo.local","secret":"fincilia-demo-only"}'             | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsS http://127.0.0.1:58080/api/v1/me -H "Authorization: Bearer $TOKEN"             | tee /dev/stderr | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["companies"])==2, d'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:58080/api/v1/me)" = 401

      - name: The web serves the sign-in page and guards the rest
        run: |
          curl -fsS http://127.0.0.1:53000/entrar | grep -q 'Fincilia'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:53000/empresas)" = 307
          curl -fsS -D - -o /dev/null http://127.0.0.1:53000/entrar | grep -qi 'content-security-policy'

      - name: Cleanup exact local project
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans

  performance-lane:
    name: Performance lane (productive ceiling, on demand)
    # No corre en cada commit a proposito: el limite productivo completo no
    # caben en el presupuesto de tiempo de una corrida por empuje, y el coste no
    # lo paga quien escribe la prueba sino cada persona que empuja un cambio.
    # Se lanza a mano desde la pestana de acciones.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: infra/local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the dependencies the lane needs
        run: docker compose up -d --wait postgres valkey objectstore
      - name: Apply migrations
        run: docker compose --profile migrate run --rm migrate
      - name: Seed the synthetic demo
        run: >-
          docker compose --profile migrate run --rm migrate
          python -m db.seed.local
      - name: The productive row ceiling, measured
        run: >-
          docker compose --profile migrate run --rm
          -e FINCILIA_PERF_LANE=true migrate
          python -m unittest db.tests.test_perf_lane -v
      - name: Cleanup
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans

  authorization-event-spike:
    name: Authorization, event and parser boundary spike
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spikes/FNC-PLT-005
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start PostgreSQL
        run: docker compose up -d --wait
      - name: Typecheck, dependency audit and integration tests
        run: >-
          docker compose --profile test run --rm integration-test sh -lc
          "npm ci --ignore-scripts && npm audit --audit-level=high && npm run typecheck && npm test"
      - name: Python parser boundary tests
        working-directory: spikes/FNC-PLT-005/worker
        run: python3 -m unittest -v
      - name: Cleanup
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
