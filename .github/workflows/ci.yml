name: fincilia-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fincilia-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-data-policy:
    name: Repository and synthetic-data policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Repository policy
        run: python -m tools.quality_gate.cli
      - name: Python unit tests
        run: >-
          python -m unittest
          tools.architecture_model.test_validate
          tools.canonical_model.test_validate
          tools.completeness_model.test_validate
          tools.connector_model.test_validate
          tools.dfd_model.test_validate
          tools.event_model.test_validate
          tools.idempotency_model.test_validate
          tools.privacy_model.test_validate
          tools.threat_model.test_validate
          tools.quality_gate.test_repo_policy
          tools.synthetic_corpus.test_corpus -v
      - name: Validate executable architecture model
        run: python -m tools.architecture_model.validate
      - name: Validate executable canonical domain model
        run: python -m tools.canonical_model.validate
      - name: Validate completeness and balance model
        run: python -m tools.completeness_model.validate
      - name: Validate connector contract
        run: python -m tools.connector_model.validate
      - name: Validate executable data-flow model
        run: python -m tools.dfd_model.validate
      - name: Validate events, retries and dead letters
        run: python -m tools.event_model.validate
      - name: Validate idempotency and dedupe model
        run: python -m tools.idempotency_model.validate
      - name: Validate executable privacy model
        run: python -m tools.privacy_model.validate
      - name: Validate executable threat model
        run: python -m tools.threat_model.validate
      - name: Verify synthetic corpus byte for byte
        run: python -m tools.synthetic_corpus.cli verify --root tests/golden/synthetic
      - name: Authorization kernel tests in pinned Node
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --workdir /workspace
          node:22.20.0-alpine@sha256:dbcedd8aeab47fbc0f4dd4bffa55b7c3c729a707875968d467aaaea42d6225af
          node --test spikes/FNC-SEC-001/test/*.test.mjs

  stack-spike:
    name: PostgreSQL RLS and worker spike
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spikes/FNC-PLT-001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start PostgreSQL
        run: docker compose up -d --wait
      - name: Typecheck, dependency audit and integration tests
        run: >-
          docker compose --profile test run --rm api-test sh -lc
          "npm ci --ignore-scripts && npm audit --audit-level=high && npm run typecheck && npm test"
      - name: Python worker tests
        working-directory: spikes/FNC-PLT-001/worker
        run: python3 -m unittest -v
      - name: Cleanup
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
