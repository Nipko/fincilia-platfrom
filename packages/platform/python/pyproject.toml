[project]
name = "fincilia-platform"
version = "0.1.0"
description = "Configuracion y sondas compartidas del stack local de Fincilia"
requires-python = ">=3.12"
dynamic = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fincilia_platform*"]
